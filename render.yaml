services:
  - type: web
    name: student-info-system-api
    runtime: node
    buildCommand: "cd backend && npm run build"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: student-info-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: student-info-redis
          property: connectionString

  - type: pserv
    name: student-info-db
    runtime: postgresql
    plan: starter
    databaseName: student_info_system
    user: student_info_user

  - type: redis
    name: student-info-redis
    ipAllowList: []
