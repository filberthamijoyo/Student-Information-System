services:
  - type: web
    name: student-info-system-api
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: student-info-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
    databases:
      - name: student-info-db
        databaseName: student_info_system
        user: student_info_user
        plan: starter

  - type: redis
    name: student-info-redis
    ipAllowList: []
