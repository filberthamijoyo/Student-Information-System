services:
  - type: web
    name: student-info-system-api
    runtime: node
    rootDir: backend
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: student-info-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: student-info-redis
          property: connectionString

  - type: pserv
    name: student-info-db
    plan: starter

  - type: redis
    name: student-info-redis
    plan: starter
